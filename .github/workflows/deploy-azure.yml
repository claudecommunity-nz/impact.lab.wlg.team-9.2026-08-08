name: Deploy to Azure

# Run deploy/azure/bootstrap.sh once before this will work — it creates the
# infrastructure and the OIDC federation this workflow authenticates with.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Rebuild every image even if nothing in it changed"
        type: boolean
        default: false

permissions:
  id-token: write # required to request the OIDC token
  contents: read

# One deploy at a time. Recreating a container group while another run is
# midway through doing the same leaves it in a state neither run expects.
concurrency:
  group: azure-deploy
  cancel-in-progress: false

env:
  TAG: ${{ github.sha }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image: [ingestion, scrapers, enrichment, ui]
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Built in Azure rather than on the runner. ACI is amd64-only, and this
      # keeps the build architecture correct no matter what builds it —
      # including a local run from an Apple Silicon Mac.
      - name: Build and push team9-${{ matrix.image }}
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "team9-${{ matrix.image }}:${TAG}" \
            --image "team9-${{ matrix.image }}:latest" \
            --platform linux/amd64 \
            --file "${{ matrix.image }}/Dockerfile" \
            "${{ matrix.image }}"

  deploy:
    name: Deploy container group
    runs-on: ubuntu-latest
    needs: build
    outputs:
      url: ${{ steps.urls.outputs.ui }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Read from Key Vault, not from a repo secret. Repo secrets are readable
      # by a workflow on any branch, so anyone with push access could print
      # them; the OIDC federation this job authenticates with is scoped to
      # refs/heads/main, so reaching the vault takes a merge.
      - name: Read the database connection string from Key Vault
        run: |
          if ! MONGO_URI="$(az keyvault secret show \
                --vault-name '${{ vars.AZURE_KEY_VAULT_NAME }}' \
                --name '${{ vars.MONGO_SECRET_NAME }}' \
                --query value -o tsv 2>&1)"; then
            echo "::error::Could not read '${{ vars.MONGO_SECRET_NAME }}' from Key Vault '${{ vars.AZURE_KEY_VAULT_NAME }}'. Check the deploy identity still has the 'Key Vault Secrets User' role. Re-run deploy/azure/bootstrap.sh to repair."
            exit 1
          fi
          # Belt and braces: Actions masks registered secrets, but this value
          # never was one.
          echo "::add-mask::$MONGO_URI"
          echo "MONGO_URI=$MONGO_URI" >> "$GITHUB_ENV"

      # Optional, unlike the database. A missing key means the Reddit collector
      # reports itself skipped on the pipeline dashboard — visible and fixable
      # — which beats refusing to deploy the whole site over one source.
      - name: Read the Reddit corpus key from Key Vault
        run: |
          REDDIT_API_KEY="$(az keyvault secret show \
            --vault-name '${{ vars.AZURE_KEY_VAULT_NAME }}' \
            --name '${{ vars.REDDIT_SECRET_NAME || 'reddit-api-key' }}' \
            --query value -o tsv 2>/dev/null || true)"
          if [ -n "$REDDIT_API_KEY" ]; then
            echo "::add-mask::$REDDIT_API_KEY"
            echo "Reddit corpus key found"
          else
            echo "::notice::No reddit-api-key in Key Vault — the Reddit collector will report as skipped."
          fi
          echo "REDDIT_API_KEY=$REDDIT_API_KEY" >> "$GITHUB_ENV"

      - name: Read the registry credentials
        run: |
          ACR_PASSWORD="$(az acr credential show \
            --name '${{ vars.AZURE_ACR_NAME }}' \
            --query 'passwords[0].value' -o tsv)"
          echo "::add-mask::$ACR_PASSWORD"
          {
            echo "ACR_PASSWORD=$ACR_PASSWORD"
            echo "ACR_SERVER=$(az acr show --name '${{ vars.AZURE_ACR_NAME }}' --query loginServer -o tsv)"
            echo "ACR_USERNAME=$(az acr credential show --name '${{ vars.AZURE_ACR_NAME }}' --query username -o tsv)"
          } >> "$GITHUB_ENV"

      # Backs the Azure Files share Caddy keeps its certificates on, so a
      # deploy does not throw away a working certificate and ask for another.
      - name: Read the storage key
        run: |
          if ! STORAGE_KEY="$(az storage account keys list \
                --account-name '${{ vars.AZURE_STORAGE_ACCOUNT }}' \
                --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
                --query '[0].value' -o tsv 2>&1)"; then
            echo "::error::Could not read the key for storage account '${{ vars.AZURE_STORAGE_ACCOUNT }}'. Re-run deploy/azure/bootstrap.sh to create it."
            exit 1
          fi
          echo "::add-mask::$STORAGE_KEY"
          echo "STORAGE_KEY=$STORAGE_KEY" >> "$GITHUB_ENV"
          echo "STORAGE_ACCOUNT=${{ vars.AZURE_STORAGE_ACCOUNT }}" >> "$GITHUB_ENV"

      # Optional. Absent, the render step drops the screenshot collector from
      # the container group and everything else deploys as normal — a missing
      # key should cost one collector, not the site.
      - name: Read the vision key from Key Vault
        run: |
          ANTHROPIC_API_KEY="$(az keyvault secret show \
            --vault-name '${{ vars.AZURE_KEY_VAULT_NAME }}' \
            --name anthropic-api-key --query value -o tsv 2>/dev/null || true)"
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::No 'anthropic-api-key' in Key Vault — the screenshot intake will not be deployed. Add one with ./deploy/azure/deploy.sh secret anthropic-api-key."
          else
            echo "::add-mask::$ANTHROPIC_API_KEY"
          fi
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> "$GITHUB_ENV"

      # A container-scoped SAS, minted per deploy rather than stored. It is
      # the only thing that opens the screenshot container, and it is held by
      # the API and the collector — never handed to a browser.
      - name: Mint a SAS for the screenshot container
        run: |
          EXPIRY="$(date -u -d '+30 days' '+%Y-%m-%dT%H:%MZ')"
          SAS="$(az storage container generate-sas \
            --name screenshots \
            --account-name '${{ vars.AZURE_STORAGE_ACCOUNT }}' \
            --account-key "$STORAGE_KEY" \
            --permissions racwdl \
            --expiry "$EXPIRY" \
            --https-only \
            -o tsv)"
          echo "::add-mask::$SAS"
          echo "SCREENSHOT_BLOB_SAS=$SAS" >> "$GITHUB_ENV"
          echo "SCREENSHOT_BLOB_URL=https://${{ vars.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/screenshots" >> "$GITHUB_ENV"

      - name: Render the container group definition
        env:
          LOCATION: ${{ vars.AZURE_LOCATION }}
          GROUP_NAME: ${{ vars.ACI_GROUP_NAME }}
          DNS_LABEL: ${{ vars.ACI_DNS_LABEL }}
          DEPLOY_SOURCE: github-actions
          # MONGO_URI comes from the Key Vault step above, via GITHUB_ENV.
        run: |
          chmod +x deploy/azure/render-aci.sh
          ./deploy/azure/render-aci.sh > aci.generated.yaml
          # Confirm the secret did not survive into the log-visible output.
          grep -q "secureValue" aci.generated.yaml

      # A container group cannot be updated in place — the image tag changes on
      # every commit, and that is not a mutable field. Delete, then create.
      - name: Replace the container group
        run: |
          if az container show \
               --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
               --name "${{ vars.ACI_GROUP_NAME }}" >/dev/null 2>&1; then
            echo "Deleting the previous group"
            az container delete \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.ACI_GROUP_NAME }}" --yes --output none
          fi

          az container create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --file aci.generated.yaml \
            --output none

      - name: Work out the public URLs
        id: urls
        run: |
          FQDN="$(az container show \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name '${{ vars.ACI_GROUP_NAME }}' \
            --query ipAddress.fqdn -o tsv)"
          echo "fqdn=$FQDN"         >> "$GITHUB_OUTPUT"
          echo "ui=https://$FQDN/"  >> "$GITHUB_OUTPUT"

      # Deploying is not the same as working. This fails the run if the stack
      # comes up unhealthy, rather than reporting a green tick on a broken app.
      - name: Smoke test
        run: |
          FQDN="${{ steps.urls.outputs.fqdn }}"

          echo "Waiting for the API to answer..."
          for attempt in $(seq 1 40); do
            if curl -sf --max-time 10 "http://$FQDN:8000/healthz" >/dev/null; then
              echo "API healthy after ~$((attempt * 15))s"
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::API never became healthy"
              az container logs --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                --name "${{ vars.ACI_GROUP_NAME }}" --container-name api --tail 60 || true
              exit 1
            fi
            sleep 15
          done

          echo "Checking the UI is served over plain HTTP..."
          curl -sf --max-time 10 -o /dev/null "http://$FQDN:8080/" \
            || { echo "::error::UI did not respond on 8080"; exit 1; }

          # Certificate issuance is the slow, flaky part of a deploy — it
          # depends on Let's Encrypt reaching us and on rate limits we do not
          # control. Given its own generous wait and its own error message, so
          # a TLS problem never gets mistaken for a broken application.
          echo "Waiting for Caddy to obtain a certificate..."
          tls_ok=""
          for attempt in $(seq 1 30); do
            if curl -sf --max-time 10 -o /dev/null "https://$FQDN/"; then
              echo "HTTPS live after ~$((attempt * 10))s"
              tls_ok=1
              break
            fi
            sleep 10
          done

          if [ -z "$tls_ok" ]; then
            echo "::warning::HTTPS is not answering. Plain HTTP on :8080 and :8000 is up, so the app is fine — this is certificate issuance. Caddy logs follow."
            az container logs --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.ACI_GROUP_NAME }}" --container-name caddy || true
          else
            echo "Certificate:"
            curl -sv --max-time 10 -o /dev/null "https://$FQDN/" 2>&1 \
              | grep -E "subject:|issuer:|expire" || true
            echo "Checking the API through HTTPS..."
            curl -sf --max-time 20 "https://$FQDN/api/stats" -o /dev/null \
              || { echo "::error::API not reachable through the HTTPS origin"; exit 1; }
          fi

          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "Checking the screenshot route answers (404 for an unknown image is the healthy case)..."
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              "http://$FQDN:8000/screenshots/$(printf 'a%.0s' $(seq 40)).png")"
            [ "$CODE" = "404" ] \
              || { echo "::error::/screenshots returned $CODE, expected 404 — the route is not wired up"; exit 1; }
          fi

          echo "Checking GeoJSON endpoints are valid JSON..."
          curl -sf --max-time 20 "http://$FQDN:8000/clusters.geojson" | python3 -c \
            "import json,sys; d=json.load(sys.stdin); assert d['type']=='FeatureCollection'; print('clusters.geojson OK')"

          echo "Waiting for the first scrape to land..."
          for attempt in $(seq 1 20); do
            TOTAL="$(curl -sf --max-time 10 "http://$FQDN:8000/stats" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['signals']['total'])" 2>/dev/null || echo 0)"
            if [ "${TOTAL:-0}" -gt 0 ]; then
              echo "$TOTAL signals ingested"
              break
            fi
            sleep 15
          done

          curl -sf --max-time 10 "http://$FQDN:8000/stats" | python3 -m json.tool

      - name: Summary
        if: always()
        run: |
          FQDN="${{ steps.urls.outputs.fqdn }}"
          {
            echo "## Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **UI** | https://$FQDN/ |"
            echo "| Signals GeoJSON | https://$FQDN/api/signals.geojson |"
            echo "| Groups GeoJSON | https://$FQDN/api/clusters.geojson |"
            echo "| API docs | https://$FQDN/api/docs |"
            echo "| Stats | https://$FQDN/api/stats |"
            echo ""
            echo "Plain HTTP fallback: http://$FQDN:8080/ · API http://$FQDN:8000/"
            echo ""
            echo "Image tag \`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
