<!doctype html>
<meta charset="utf-8">
<title>slide</title>
<style>
  /* The deck's own navy, so the hairline of letterboxing left after trimming
     reads as part of the slide rather than as a bar. */
  html, body { margin: 0; height: 100%; background: #232a63; }
  img {
    width: 100%; height: 100%;
    object-fit: contain; object-position: center;
    display: block;
  }
</style>
<img id="s" alt="">
<script>
  // Slide number in the hash, so capture.py can move between slides without
  // writing a file per slide.
  function show() {
    const n = parseInt(location.hash.slice(1), 10) || 1;
    document.getElementById("s").src = `slide-${n}.png`;
  }
  addEventListener("hashchange", show);
  show();
</script>
