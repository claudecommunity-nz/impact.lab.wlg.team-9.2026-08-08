# Azure Container Instances container group.
#
# Generated from this template by render-aci.sh — __PLACEHOLDERS__ are
# substituted there. Deploy the generated file with:
#
#     az container create --resource-group <rg> --file aci.generated.yaml
#
# Every container in a group shares one network namespace, so services address
# each other on 127.0.0.1 rather than by compose service name. That is the main
# difference from docker-compose.yml. The other is storage: compose runs its own
# MongoDB container, this points at a MongoDB Atlas cluster outside Azure, so
# the data survives the group being deleted and recreated on every deploy.

apiVersion: "2021-10-01"
location: __LOCATION__
name: __GROUP_NAME__
type: Microsoft.ContainerInstance/containerGroups

properties:
  osType: Linux
  restartPolicy: Always

  imageRegistryCredentials:
    - server: __ACR_SERVER__
      username: __ACR_USERNAME__
      password: __ACR_PASSWORD__

  ipAddress:
    type: Public
    dnsNameLabel: __DNS_LABEL__
    ports:
      - protocol: tcp
        port: 80      # UI
      - protocol: tcp
        port: 8000    # API — exposed so the shared operating picture can read
                      # /signals.geojson and /clusters.geojson directly

  containers:
    # --- ingestion API -----------------------------------------------------
    # No mongo container: storage is a MongoDB Atlas cluster, outside the
    # group, so a redeploy (which always recreates the group) keeps its data.
    - name: api
      properties:
        image: __ACR_SERVER__/team9-ingestion:__TAG__
        ports:
          - port: 8000
        environmentVariables:
          # secureValue keeps the connection string out of `az container show`
          # and out of the portal's environment listing.
          - name: MONGO_URI
            secureValue: __MONGO_URI__
          - name: MONGO_DB
            value: signals
          - name: LOG_LEVEL
            value: INFO
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1.0

    # --- scrapers ----------------------------------------------------------
    # One container running every collector, rather than one container each.
    # A container group has a hard resource ceiling and per-container overhead
    # that a scraper polling every ten minutes does not justify.
    - name: scrapers
      properties:
        image: __ACR_SERVER__/team9-scrapers:__TAG__
        environmentVariables:
          - name: INGESTION_URL
            value: http://127.0.0.1:8000
          - name: SOURCES
            value: rss,geonet,mastodon,fixtures
          - name: SCRAPE_INTERVAL_SECONDS
            value: "600"
          - name: LOG_LEVEL
            value: INFO
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1.0

    # --- enrichment --------------------------------------------------------
    - name: enrichment
      properties:
        image: __ACR_SERVER__/team9-enrichment:__TAG__
        environmentVariables:
          - name: MONGO_URI
            secureValue: __MONGO_URI__
          - name: MONGO_DB
            value: signals
          # Keep in step with the default in docker-compose.yml. A job that
          # exists but is missing here runs locally and silently does not run
          # in Azure — enrichment/run.py logs a warning naming any job in the
          # registry that this line forgot.
          - name: ENRICHMENT_SCHEDULE
            value: classify:30,geolocate:30,corroborate:60,admiralty:60
          - name: CLUSTER_RADIUS_KM
            value: "2.0"
          - name: CLUSTER_WINDOW_HOURS
            value: "12"
          - name: LOG_LEVEL
            value: INFO
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1.0

    # --- UI ----------------------------------------------------------------
    - name: ui
      properties:
        image: __ACR_SERVER__/team9-ui:__TAG__
        ports:
          - port: 80
        environmentVariables:
          # Same namespace, so the nginx proxy target is loopback here.
          - name: API_UPSTREAM
            value: 127.0.0.1:8000
          - name: NGINX_ENVSUBST_FILTER
            value: API_UPSTREAM
        resources:
          requests:
            cpu: 0.25
            memoryInGB: 0.5

tags:
  project: impact-lab-wellington
  team: "9"
  deployed-from: __DEPLOY_SOURCE__
