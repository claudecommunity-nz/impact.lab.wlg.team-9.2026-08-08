# Azure Container Instances container group.
#
# Generated from this template by render-aci.sh — __PLACEHOLDERS__ are
# substituted there. Deploy the generated file with:
#
#     az container create --resource-group <rg> --file aci.generated.yaml
#
# Every container in a group shares one network namespace, so services address
# each other on 127.0.0.1 rather than by compose service name. That is the main
# difference from docker-compose.yml. The other is storage: compose runs its own
# MongoDB container, this points at a MongoDB Atlas cluster outside Azure, so
# the data survives the group being deleted and recreated on every deploy.

apiVersion: "2021-10-01"
location: "__LOCATION__"
name: "__GROUP_NAME__"
type: Microsoft.ContainerInstance/containerGroups

properties:
  osType: Linux
  restartPolicy: Always

  imageRegistryCredentials:
    - server: "__ACR_SERVER__"
      username: "__ACR_USERNAME__"
      password: "__ACR_PASSWORD__"

  ipAddress:
    type: Public
    dnsNameLabel: "__DNS_LABEL__"
    ports:
      - protocol: tcp
        port: 443     # UI over HTTPS, via Caddy
      - protocol: tcp
        port: 80      # Caddy: ACME HTTP-01 challenge, and redirect to 443
      - protocol: tcp
        port: 8080    # nginx direct, plain HTTP — deliberate demo insurance.
                      # If ACME ever fails there is still a working URL rather
                      # than a site that is entirely down four minutes before
                      # a demo.
      - protocol: tcp
        port: 8000    # API — exposed so the shared operating picture can read
                      # /signals.geojson and /clusters.geojson directly

  volumes:
    - name: caddy-data
      azureFile:
        shareName: caddy-data
        storageAccountName: "__STORAGE_ACCOUNT__"
        storageAccountKey: "__STORAGE_KEY__"

  containers:
    # --- ingestion API -----------------------------------------------------
    # No mongo container: storage is a MongoDB Atlas cluster, outside the
    # group, so a redeploy (which always recreates the group) keeps its data.
    - name: api
      properties:
        image: "__ACR_SERVER__/team9-ingestion:__TAG__"
        ports:
          - port: 8000
        environmentVariables:
          # secureValue keeps the connection string out of `az container show`
          # and out of the portal's environment listing.
          - name: MONGO_URI
            secureValue: "__MONGO_URI__"
          - name: MONGO_DB
            value: signals
          - name: LOG_LEVEL
            value: INFO
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1.0

    # --- scrapers ----------------------------------------------------------
    # One container running every collector, rather than one container each.
    # A container group has a hard resource ceiling and per-container overhead
    # that a scraper polling every ten minutes does not justify.
    - name: scrapers
      properties:
        image: "__ACR_SERVER__/team9-scrapers:__TAG__"
        environmentVariables:
          - name: INGESTION_URL
            value: http://127.0.0.1:8000
          # No `fixtures` here. The synthetic replay exists so the demo
          # survives dead venue wifi, which is a local concern — in production
          # it would put invented events on a map of real ones. Labelled all
          # the way through, but still better absent.
          #
          # docker-compose.yml deliberately keeps it: offline development is
          # exactly the case it was written for.
          - name: SOURCES
            value: rss,geonet,mastodon,reddit
          - name: SCRAPE_INTERVAL_SECONDS
            value: "600"
          - name: LOG_LEVEL
            value: INFO
          # Reddit corpus replay. The key lives in Key Vault and is read at
          # deploy time; if it is absent the collector reports itself skipped
          # on the dashboard rather than failing, so a missing credential
          # never takes a deploy down.
          - name: REDDIT_API_KEY
            secureValue: "__REDDIT_API_KEY__"
          # The corpus is historical, so the collector runs on a clock shifted
          # back by the interval between these two anchors. Plain values, not
          # secure ones — the whole point is that the shift is visible.
          - name: SIM_ANCHOR
            value: "__SIM_ANCHOR__"
          - name: SIM_REAL_ANCHOR
            value: "__SIM_REAL_ANCHOR__"
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1.0

    # --- enrichment --------------------------------------------------------
    - name: enrichment
      properties:
        image: "__ACR_SERVER__/team9-enrichment:__TAG__"
        environmentVariables:
          - name: MONGO_URI
            secureValue: "__MONGO_URI__"
          - name: MONGO_DB
            value: signals
          # Keep in step with the default in docker-compose.yml. A job that
          # exists but is missing here runs locally and silently does not run
          # in Azure — enrichment/run.py logs a warning naming any job in the
          # registry that this line forgot.
          - name: ENRICHMENT_SCHEDULE
            value: classify:30,geolocate:30,corroborate:60,admiralty:60,prioritise:60
          - name: CLUSTER_RADIUS_KM
            value: "2.0"
          - name: CLUSTER_WINDOW_HOURS
            value: "12"
          - name: LOG_LEVEL
            value: INFO
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1.0

    # --- UI ----------------------------------------------------------------
    - name: ui
      properties:
        image: "__ACR_SERVER__/team9-ui:__TAG__"
        ports:
          - port: 8080
        environmentVariables:
          # Same namespace, so the nginx proxy target is loopback here.
          - name: API_UPSTREAM
            value: 127.0.0.1:8000
          - name: UI_LISTEN_PORT
            value: "8080"
          - name: NGINX_ENVSUBST_FILTER
            value: (API_UPSTREAM|UI_LISTEN_PORT)
        resources:
          requests:
            cpu: 0.25
            memoryInGB: 0.5

    # --- TLS ---------------------------------------------------------------
    # Caddy terminates HTTPS and proxies to nginx. It obtains and renews the
    # certificate itself over ACME, with no key material in this repo and
    # nothing to remember to rotate.
    #
    # This works without a custom domain because *.azurecontainer.io is on the
    # Public Suffix List, which makes the full hostname below its own
    # registered domain as far as Let's Encrypt is concerned — so it gets its
    # own rate-limit budget rather than sharing one with every other Azure
    # Container Instance in the world.
    #
    # The stock image with a command override, rather than a fifth image to
    # build: `caddy reverse-proxy` turns on automatic HTTPS by itself.
    - name: caddy
      properties:
        image: caddy:2.8-alpine
        command:
          - caddy
          - reverse-proxy
          - --from
          - "__FQDN__"
          - --to
          - 127.0.0.1:8080
        ports:
          - port: 443
          - port: 80
        volumeMounts:
          # Certificates persist across deploys. Every deploy deletes and
          # recreates this group, and Let's Encrypt allows only 5 duplicate
          # certificates per week — without this, a day of iterating would
          # exhaust that and leave the demo on a rate-limit error.
          - name: caddy-data
            mountPath: /data
        resources:
          requests:
            cpu: 0.25
            memoryInGB: 0.5

tags:
  project: impact-lab-wellington
  team: "9"
  deployed-from: "__DEPLOY_SOURCE__"
